<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Target map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">
<style>
  :root {
    --purple: #321D49;
    --blue:   #64C4DE;
    --pink:   #EA5688;
    --white:  #FFFFFF;
    --green:  #32B08C;
    --shadow: 0 6px 28px rgba(50, 29, 73, .18);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: var(--purple);
    background: var(--purple);
    -webkit-font-smoothing: antialiased;
  }

  /* White backdrop: the style's land layer is semi-transparent and composites onto it. */
  #map { position: absolute; inset: 0; background: var(--white); }

  .mapboxgl-ctrl-group { border-radius: 10px !important; box-shadow: var(--shadow) !important; }
  .mapboxgl-ctrl-attrib, .mapboxgl-ctrl-attrib a { font-family: inherit; color: var(--purple); }

  /* ---------- legend panel ---------- */

  #panel {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 330px;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 32px);
    display: flex;
    flex-direction: column;
    background: var(--white);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
    z-index: 5;
  }

  #panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    padding: 16px 18px;
    border: 0;
    background: var(--purple);
    color: var(--white);
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .01em;
    text-align: left;
    cursor: pointer;
  }

  #panel-header:focus-visible { outline: 3px solid var(--blue); outline-offset: -3px; }

  #chevron {
    flex: none;
    width: 14px;
    height: 14px;
    border-right: 2px solid var(--white);
    border-bottom: 2px solid var(--white);
    transform: rotate(45deg) translate(-2px, -2px);
    transition: transform .2s ease;
  }

  #panel.collapsed #chevron { transform: rotate(-135deg) translate(-3px, -3px); }

  #panel-body { padding: 6px 18px 18px; overflow-y: auto; }
  #panel.collapsed #panel-body { display: none; }

  .layer {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid rgba(50, 29, 73, .12);
    cursor: pointer;
  }

  .layer:last-of-type { border-bottom: 0; padding-bottom: 4px; }

  .swatch {
    flex: none;
    width: 20px;
    height: 20px;
    margin-top: 2px;
    border-radius: 5px;
    border: 1px solid rgba(50, 29, 73, .2);
    transition: opacity .2s ease;
  }

  .layer input:not(:checked) ~ .swatch { opacity: .25; }

  .text { flex: 1 1 auto; min-width: 0; }

  .name {
    display: block;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.3;
  }

  .desc {
    display: block;
    margin-top: 3px;
    font-size: 12.5px;
    font-weight: 300;
    line-height: 1.45;
    color: rgba(50, 29, 73, .72);
  }

  .layer input {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
  }

  .switch {
    flex: none;
    position: relative;
    width: 40px;
    height: 22px;
    margin-top: 1px;
    border-radius: 11px;
    background: rgba(50, 29, 73, .22);
    transition: background .2s ease;
  }

  .switch::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--white);
    transition: transform .2s ease;
  }

  .layer input:checked ~ .switch { background: var(--pink); }
  .layer input:checked ~ .switch::after { transform: translateX(18px); }
  .layer input:focus-visible ~ .switch { outline: 3px solid var(--blue); outline-offset: 2px; }

  .note {
    margin: 14px 0 0;
    padding-top: 12px;
    border-top: 1px solid rgba(50, 29, 73, .12);
    font-size: 11.5px;
    font-weight: 300;
    line-height: 1.5;
    color: rgba(50, 29, 73, .6);
  }

  /* ---------- member points ---------- */

  .swatch--dot {
    width: 16px;
    height: 16px;
    margin: 4px 2px 0;
    border-radius: 50%;
    border: 1.5px solid var(--white);
    box-shadow: 0 0 0 1px rgba(50, 29, 73, .2);
  }

  .mapboxgl-popup-content {
    padding: 14px 16px 15px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    font-family: inherit;
    color: var(--purple);
  }

  .mapboxgl-popup-close-button { display: none; }

  .popup-name {
    margin: 0 22px 0 0;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.3;
  }

  .popup-close {
    position: absolute;
    top: 9px;
    right: 9px;
    width: 22px;
    height: 22px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(50, 29, 73, .08);
    color: var(--purple);
    font: inherit;
    font-size: 15px;
    line-height: 20px;
    cursor: pointer;
  }

  .popup-close:hover { background: rgba(50, 29, 73, .16); }

  /* ---------- password gate ---------- */

  #gate {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--purple);
  }

  #gate[hidden] { display: none; }

  #gate-card {
    width: 100%;
    max-width: 380px;
    padding: 34px 32px 30px;
    border-radius: 16px;
    background: var(--white);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    text-align: left;
  }

  #gate-card h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -.01em;
  }

  #gate-card p {
    margin: 8px 0 22px;
    font-size: 13.5px;
    font-weight: 300;
    line-height: 1.5;
    color: rgba(50, 29, 73, .7);
  }

  #gate-card label {
    display: block;
    margin-bottom: 7px;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  #password {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid rgba(50, 29, 73, .25);
    border-radius: 9px;
    background: var(--white);
    font: inherit;
    font-size: 15px;
    color: var(--purple);
  }

  #password:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(100, 196, 222, .35); }

  #gate button {
    width: 100%;
    margin-top: 16px;
    padding: 13px 16px;
    border: 0;
    border-radius: 9px;
    background: var(--pink);
    color: var(--white);
    font: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s ease;
  }

  #gate button:hover { background: #d94578; }
  #gate button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  #error {
    min-height: 18px;
    margin: 10px 0 0;
    font-size: 12.5px;
    font-weight: 400;
    color: var(--pink);
  }

  .bar { height: 5px; display: flex; border-radius: 3px; overflow: hidden; margin-bottom: 22px; }
  .bar span { flex: 1; }

  @media (max-width: 640px) {
    #panel { top: 10px; left: 10px; right: 10px; width: auto; max-height: calc(100vh - 20px); }
  }
</style>
</head>
<body>

<div id="map" aria-label="Map of target areas"></div>

<section id="panel" hidden>
  <button id="panel-header" type="button" aria-expanded="true" aria-controls="panel-body">
    <span>Target areas</span>
    <span id="chevron" aria-hidden="true"></span>
  </button>
  <div id="panel-body">

    <label class="layer">
      <input type="checkbox" data-layer="imd" checked>
      <span class="swatch" style="background:#321D49"></span>
      <span class="text">
        <span class="name">Deprivation</span>
        <span class="desc">Neighbourhoods in the most deprived fifth of England on the English Index of Multiple Deprivation 2025.</span>
      </span>
      <span class="switch" aria-hidden="true"></span>
    </label>

    <label class="layer">
      <input type="checkbox" data-layer="low-eco-takeup" checked>
      <span class="swatch" style="background:#EA5688"></span>
      <span class="text">
        <span class="name">Low ECO take-up</span>
        <span class="desc">Constituencies in Great Britain where fewer than 7.5% of households received measures under the Energy Company Obligation.</span>
      </span>
      <span class="switch" aria-hidden="true"></span>
    </label>

    <label class="layer">
      <input type="checkbox" data-layer="toryreform-seatshare" checked>
      <span class="swatch" style="background:#64C4DE"></span>
      <span class="text">
        <span class="name">Conservative &amp; Reform seat share</span>
        <span class="desc">Councils where the Conservatives and Reform UK together held more than half the seats.</span>
      </span>
      <span class="switch" aria-hidden="true"></span>
    </label>

    <label class="layer">
      <input type="checkbox" data-layer="cee-members" checked>
      <span class="swatch swatch--dot" style="background:#32B08C"></span>
      <span class="text">
        <span class="name">Community energy organisations</span>
        <span class="desc">Members of Community Energy England, at their registered address — fanned out slightly where several share one. Hover a point to name it, click to keep the label open.</span>
      </span>
      <span class="switch" aria-hidden="true"></span>
    </label>

    <p class="note">Layers are semi-transparent, so overlapping areas — the strongest targets — show as blended colour. Each layer uses the latest data available in September 2026.</p>
  </div>
</section>

<div id="gate">
  <form id="gate-card">
    <div class="bar"><span style="background:#321D49"></span><span style="background:#64C4DE"></span><span style="background:#EA5688"></span></div>
    <h1>Target map</h1>
    <p>Internal tool. Enter the password to continue.</p>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <p id="error" role="alert"></p>
    <button type="submit">Open map</button>
  </form>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
<script>
(function () {
  'use strict';

  var TOKEN = 'pk.eyJ1IjoicmFkaW9lZGl0IiwiYSI6ImNpZ2F4NGw1MzFhaDd0Zmx5NGtoaXBnZTgifQ.LKXJIMW7qqWDRD8QCnMqaw';
  var STYLE = 'mapbox://styles/radioedit/cmt1fk8py002h01s39qjmdqo6';
  // SHA-256 of the password. Client-side only — a speed bump, not real security.
  var HASH = '8027386bb683d4ac3c941eee4909a79a0a013bbbeacdf4a885158970ec901621';
  var KEY = 'targetmap-unlocked';
  var ENGLAND_AND_WALES = [[-6.5, 49.85], [1.85, 55.9]];
  var MEMBERS_CSV = 'ceemembers.csv';
  var MEMBERS_LAYER = 'cee-members';

  var gate = document.getElementById('gate');
  var form = document.getElementById('gate-card');
  var input = document.getElementById('password');
  var error = document.getElementById('error');
  var panel = document.getElementById('panel');
  var header = document.getElementById('panel-header');

  var mapStarted = false;

  function digest(text) {
    var bytes = new TextEncoder().encode(text);
    return crypto.subtle.digest('SHA-256', bytes).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return b.toString(16).padStart(2, '0');
      }).join('');
    });
  }

  function unlock() {
    gate.hidden = true;
    panel.hidden = false;
    if (!mapStarted) { mapStarted = true; startMap(); }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    error.textContent = '';
    digest(input.value.trim()).then(function (hex) {
      if (hex === HASH) {
        try { sessionStorage.setItem(KEY, '1'); } catch (err) { /* private mode */ }
        unlock();
      } else {
        error.textContent = 'That password isn’t right. Try again.';
        input.select();
      }
    }).catch(function () {
      error.textContent = 'Couldn’t check the password — this page needs to be served over HTTPS.';
    });
  });

  function startMap() {
    mapboxgl.accessToken = TOKEN;

    var map = new mapboxgl.Map({
      container: 'map',
      style: STYLE,
      center: [-2.3, 52.9],
      zoom: 6,
      minZoom: 4,
      maxZoom: 15,
      attributionControl: true
    });

    // Keep England and Wales framed — through late layout shifts, an orientation
    // change, a phone's disappearing URL bar — until the user takes over.
    var userMoved = false;

    function frame() {
      map.fitBounds(ENGLAND_AND_WALES, { padding: 24, duration: 0 });
    }

    map.on('movestart', function (e) { if (e.originalEvent) { userMoved = true; } });
    map.on('load', function () { map.resize(); frame(); });
    map.on('resize', function () { if (!userMoved) { frame(); } });

    map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'bottom-right');
    map.addControl(new mapboxgl.GeolocateControl({ trackUserLocation: false }), 'bottom-right');

    function apply(box) {
      map.setLayoutProperty(box.dataset.layer, 'visibility', box.checked ? 'visible' : 'none');
    }

    function wire(box) {
      apply(box);
      box.addEventListener('change', function () { apply(box); });
    }

    function disable(box) {
      box.disabled = true;
      box.closest('.layer').style.opacity = '.4';
    }

    function boxFor(id) {
      return document.querySelector('#panel-body input[data-layer="' + id + '"]');
    }

    map.on('style.load', function () {
      document.querySelectorAll('#panel-body input[data-layer]').forEach(function (box) {
        // The member layer isn't in the style — it arrives with the CSV.
        if (box.dataset.layer === MEMBERS_LAYER) { return; }
        if (map.getLayer(box.dataset.layer)) { wire(box); } else { disable(box); }
      });

      addMembers(map);
    });

    map.on('error', function (e) {
      if (e && e.error) { console.error('Mapbox:', e.error.message); }
    });

    // ---- Community Energy England members ----

    function addMembers(map) {
      var box = boxFor(MEMBERS_LAYER);

      fetch(MEMBERS_CSV).then(function (r) {
        if (!r.ok) { throw new Error(r.status + ' ' + r.statusText); }
        return r.text();
      }).then(function (text) {
        map.addSource(MEMBERS_LAYER, { type: 'geojson', data: toGeoJson(parseCsv(text)) });
        map.addLayer({
          id: MEMBERS_LAYER,
          type: 'circle',
          source: MEMBERS_LAYER,
          paint: {
            'circle-radius': 5,
            'circle-color': '#32B08C',
            'circle-opacity': 0.9,
            'circle-stroke-width': 1.5,
            'circle-stroke-color': '#FFFFFF'
          }
        });
        if (box) { wire(box); }
        bindMemberPopup(map);
      }).catch(function (err) {
        console.error('Members CSV:', err.message);
        if (box) { disable(box); }
      });
    }

    function bindMemberPopup(map) {
      var popup = new mapboxgl.Popup({
        closeButton: false,
        closeOnClick: false,
        offset: 12,
        maxWidth: '260px'
      });

      // Hover opens the popup; clicking pins it so you can reach the link.
      // Touch devices report no hover, and fall through to the click path.
      var canHover = window.matchMedia('(hover: hover)').matches;
      var pinned = false;
      var timer = null;

      function close() {
        pinned = false;
        popup.remove();
      }

      function open(feature, pin) {
        window.clearTimeout(timer);
        pinned = pin;
        popup.setLngLat(feature.geometry.coordinates.slice())
             .setHTML(memberHtml(feature.properties, pin))
             .addTo(map);
      }

      // Mapbox rebuilds the popup element on each open, so wire it up every time.
      popup.on('open', function () {
        var el = popup.getElement();
        if (!el) { return; }

        var closer = el.querySelector('.popup-close');
        if (closer) { closer.addEventListener('click', close); }

        el.addEventListener('mouseenter', function () { window.clearTimeout(timer); });
        el.addEventListener('mouseleave', function () {
          if (!pinned) { timer = window.setTimeout(close, 180); }
        });
      });

      map.on('mouseenter', MEMBERS_LAYER, function (e) {
        map.getCanvas().style.cursor = 'pointer';
        if (canHover && !pinned && e.features[0]) { open(e.features[0], false); }
      });

      map.on('mouseleave', MEMBERS_LAYER, function () {
        map.getCanvas().style.cursor = '';
        if (!pinned) { timer = window.setTimeout(close, 180); }
      });

      map.on('click', MEMBERS_LAYER, function (e) {
        if (e.features[0]) { open(e.features[0], true); }
      });

      // A click on open water dismisses a pinned popup; so does Escape.
      map.on('click', function (e) {
        if (!map.getLayer(MEMBERS_LAYER)) { return; }
        if (!map.queryRenderedFeatures(e.point, { layers: [MEMBERS_LAYER] }).length) { close(); }
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { close(); }
      });
    }
  }

  function memberHtml(props, pinned) {
    var close = pinned
      ? '<button type="button" class="popup-close" aria-label="Close">&times;</button>'
      : '';

    return close + '<p class="popup-name">' + escapeHtml(props.name) + '</p>';
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Minimal RFC 4180 reader — member names and regions contain commas.
  function parseCsv(text) {
    var rows = [], row = [], field = '', quoted = false;

    for (var i = 0; i < text.length; i++) {
      var c = text[i];

      if (quoted) {
        if (c !== '"') { field += c; }
        else if (text[i + 1] === '"') { field += '"'; i++; }
        else { quoted = false; }
      } else if (c === '"') {
        quoted = true;
      } else if (c === ',') {
        row.push(field); field = '';
      } else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') { i++; }
        row.push(field); rows.push(row); row = []; field = '';
      } else {
        field += c;
      }
    }

    if (field || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function toGeoJson(rows) {
    var head = (rows.shift() || []).map(function (h) { return h.trim(); });
    var col = {};
    head.forEach(function (h, i) { col[h] = i; });

    var features = [];

    rows.forEach(function (r) {
      var lng = parseFloat(r[col.Longitude]);
      var lat = parseFloat(r[col.Latitude]);
      if (!isFinite(lng) || !isFinite(lat)) { return; }  // 7 rows have no coordinates

      features.push({
        type: 'Feature',
        geometry: { type: 'Point', coordinates: [lng, lat] },
        properties: { name: r[col.Organisation] || 'Unnamed organisation' }
      });
    });

    return { type: 'FeatureCollection', features: fanOut(features) };
  }

  // Organisations sharing a registered address land on one dot and hide each
  // other. Fan each such group evenly around its true position so every one of
  // them can be picked, keeping neighbours FAN_SPACING_M apart however many
  // there are. Deterministic, so the arrangement is the same on every load.
  var FAN_SPACING_M = 300;
  var METRES_PER_DEGREE = 111320;

  function fanOut(features) {
    var groups = {};

    features.forEach(function (f) {
      var key = f.geometry.coordinates.join(',');
      (groups[key] = groups[key] || []).push(f);
    });

    Object.keys(groups).forEach(function (key) {
      var group = groups[key];
      if (group.length < 2) { return; }

      var radius = (FAN_SPACING_M / 2) / Math.sin(Math.PI / group.length);

      group.forEach(function (f, i) {
        var lng = f.geometry.coordinates[0];
        var lat = f.geometry.coordinates[1];
        var angle = (2 * Math.PI * i) / group.length - Math.PI / 2;
        var east = radius * Math.cos(angle);
        var north = radius * Math.sin(angle);

        f.geometry.coordinates = [
          lng + east / (METRES_PER_DEGREE * Math.cos(lat * Math.PI / 180)),
          lat + north / METRES_PER_DEGREE
        ];
      });
    });

    return features;
  }

  // Collapsed on narrow screens, expanded on wide ones — until the user decides for themselves.
  function setCollapsed(collapsed) {
    panel.classList.toggle('collapsed', collapsed);
    header.setAttribute('aria-expanded', String(!collapsed));
  }

  var narrow = window.matchMedia('(max-width: 640px)');
  var userChose = false;

  header.addEventListener('click', function () {
    userChose = true;
    setCollapsed(!panel.classList.contains('collapsed'));
  });

  narrow.addEventListener('change', function (e) { if (!userChose) { setCollapsed(e.matches); } });
  setCollapsed(narrow.matches);

  var alreadyIn = false;
  try { alreadyIn = sessionStorage.getItem(KEY) === '1'; } catch (err) { /* private mode */ }

  if (alreadyIn) { unlock(); } else { input.focus(); }
})();
</script>
</body>
</html>
